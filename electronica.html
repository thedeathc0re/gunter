<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gunter | Electrónica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

<body>

<main class="col-lg-9">

    </a>

          <button class="btn-add" onclick="agregarCarrito('RX 9060 XT', 8999)">Añadir</button>

      </div>
