<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gunter | Premium Marketplace</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="main-header">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a class="logo" href="index.html">Gunter<span>.</span></a>
      
      <div class="search-container d-none d-md-flex">
        <i class="bi bi-search text-muted"></i>
        <input type="text" id="search-input" placeholder="Busca marcas, hardware y más...">
      </div>

      <div class="d-flex align-items-center gap-4">
        <a href="carrito.html" class="text-dark text-decoration-none position-relative">
          <i class="bi bi-bag fs-4"></i>
          <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem; display: none;">0</span>
        </a>
        <button class="btn btn-primary d-none d-sm-inline-block rounded-pill px-4 fw-bold">Vender</button>
      </div>
    </div>
  </header>

  <div class="container my-5">
    <div class="row">
      <aside class="col-lg-3">
        <div class="category-menu sticky-top" style="top: 100px;">
          <p class="sidebar-section-title">Marketplace</p>
          <a href="index.html" class="cat-item active"><i class="bi bi-grid"></i> Todo</a>
          <a href="hogar.html" class="cat-item"><i class="bi bi-house"></i> Hogar</a>

          <p class="sidebar-section-title">Administración</p>
          <a href="categorias.html" class="cat-item"><i class="bi bi-tags"></i> Categorías</a>
          <a href="productos-gestion.html" class="cat-item"><i class="bi bi-box-seam"></i> Productos</a>
          <a href="usuarios.html" class="cat-item"><i class="bi bi-people"></i> Usuarios</a>
        </div>
      </aside>

      <main class="col-lg-9">
        <section id="productos">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="fw-bold m-0">Catálogo General</h3>
            <span class="text-muted small">Tijuana, BC</span>
          </div>

          <div class="row g-4">
            
            <div class="col-md-4 col-sm-6">
              <div class="item-card">
                <div class="img-wrapper">
                  <span class="badge-premium">Más Vendido</span>
                  <img src="https://placehold.co/600x600/2563eb/white?text=RX+9060+XT" alt="GPU">
                </div>
                <div class="item-info">
                  <span class="item-price">$8,999.00</span>
                  <h6 class="item-title text-truncate">AMD Radeon RX 9060 XT</h6>
                  <p class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> Zona Río</p>
                  <button class="btn-add" onclick="agregarCarrito('HW-01', 'AMD Radeon RX 9060 XT', 8999, 'https://placehold.co/600x600/2563eb/white?text=RX+9060+XT')">
                    Añadir al carrito
                  </button>
                </div>
              </div>
            </div>

            <div class="col-md-4 col-sm-6">
              <div class="item-card">
                <div class="img-wrapper">
                  <img src="https://placehold.co/600x600/1e293b/white?text=Ryzen+5600X" alt="CPU">
                </div>
                <div class="item-info">
                  <span class="item-price">$3,200.00</span>
                  <h6 class="item-title text-truncate">Procesador Ryzen 5 5600X</h6>
                  <p class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> Otay</p>
                  <button class="btn-add" onclick="agregarCarrito('HW-02', 'Ryzen 5 5600X', 3200, 'https://placehold.co/600x600/1e293b/white?text=Ryzen+5600X')">
                    Añadir al carrito
                  </button>
                </div>
              </div>
            </div>

            <div class="col-md-4 col-sm-6">
              <div class="item-card">
                <div class="img-wrapper">
                  <img src="https://placehold.co/600x600/0f172a/white?text=Silla+Gamer" alt="Silla">
                </div>
                <div class="item-info">
                  <span class="item-price">$4,500.00</span>
                  <h6 class="item-title text-truncate">Silla Ergonómica Pro</h6>
                  <p class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> Playas</p>
                  <button class="btn-add" onclick="agregarCarrito('HG-01', 'Silla Ergonómica Pro', 4500, 'https://placehold.co/600x600/0f172a/white?text=Silla+Gamer')">
                    Añadir al carrito
                  </button>
                </div>
              </div>
            </div>

            <div class="col-md-4 col-sm-6">
              <div class="item-card">
                <div class="img-wrapper">
                  <img src="https://placehold.co/600x600/3b82f6/white?text=Laptop+Gunter" alt="Laptop">
                </div>
                <div class="item-info">
                  <span class="item-price">$15,400.00</span>
                  <h6 class="item-title text-truncate">Laptop Gunter Book 14"</h6>
                  <p class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> Centro</p>
                  <button class="btn-add" onclick="agregarCarrito('HW-03', 'Laptop Gunter Book 14', 15400, 'https://placehold.co/600x600/3b82f6/white?text=Laptop+Gunter')">
                    Añadir al carrito
                  </button>
                </div>
              </div>
            </div>

          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="java/Java.js"></script>
</body>
</html>
