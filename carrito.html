<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gunter | Tu Carrito</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0"><i class="bi bi-bag-check me-2"></i>Tu Carrito</h2>
        <a href="index.html" class="btn btn-outline-primary rounded-pill">
            <i class="bi bi-arrow-left me-2"></i>Seguir comprando
        </a>
    </div>
    <div class="row">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          <ul id="cart-items" class="list-group list-group-flush">
            </ul>
        </div>
        <button class="btn btn-link text-danger mt-3 px-0 text-decoration-none" onclick="limpiarCarrito()">
            <i class="bi bi-trash3 me-1"></i> Vaciar todo el carrito
        </button>
      </div>

      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 mt-4 mt-lg-0">
          <h5 class="fw-bold mb-4">Resumen de compra</h5>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Subtotal</span>
            <span id="subtotal-val">$0.00</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Envío (Tijuana)</span>
            <span class="text-success fw-bold">Gratis</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <span class="fw-bold fs-5">Total</span>
            <span class="fw-bold fs-5 text-primary">$<span id="cart-total">0.00</span> MXN</span>
          </div>
          <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold" onclick="finalizarCompra()">
            Finalizar Pedido
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="java/Java.js"></script>
</body>
</html>
