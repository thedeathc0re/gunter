<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gunter | Electrónica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="col-lg-9">
  <!-- Botón Volver -->
  <div class="mb-4">
    <a href="index.html" class="btn-back">
      <i class="bi bi-arrow-left-short"></i> Volver al inicio
    </a>
  </div>
  <h4 class="fw-bold mb-4">Artículos de Deporte</h4>
  <div class="row g-4">
    <div class="col-md-3 col-sm-6">
      <div class="item-card">
        <div class="img-wrapper"><img src="https://placehold.co/400x500?text=Mancuernas" alt="Sport"></div>
        <div class="item-info">
          <span class="item-price">$1,100</span>
          <h6 class="item-title text-truncate">Set Mancuernas 20kg</h6>
          <p class="item-location">El Soler</p>
          <button class="btn-add" onclick="agregarCarrito('Pesas', 1100)">Añadir</button>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6">
      <div class="item-card">
        <div class="img-wrapper"><img src="https://placehold.co/400x500?text=Bicicleta" alt="Sport"></div>
        <div class="item-info">
          <span class="item-price">$3,500</span>
          <h6 class="item-title text-truncate">Bicicleta Urbana R26</h6>
          <p class="item-location">Rosarito</p>
          <button class="btn-add" onclick="agregarCarrito('Bici', 3500)">Añadir</button>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6">
      <div class="item-card">
        <div class="img-wrapper"><img src="https://placehold.co/400x500?text=Balon+Basket" alt="Sport"></div>
        <div class="item-info">
          <span class="item-price">$450</span>
          <h6 class="item-title text-truncate">Balón Básquetbol Ofic.</h6>
          <p class="item-location">Auditorio Municipal</p>
          <button class="btn-add" onclick="agregarCarrito('Balon', 450)">Añadir</button>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6">
      <div class="item-card">
        <div class="img-wrapper"><img src="https://placehold.co/400x500?text=Tapete+Yoga" alt="Sport"></div>
        <div class="item-info">
          <span class="item-price">$300</span>
          <h6 class="item-title text-truncate">Tapete de Yoga Antiderrapante</h6>
          <p class="item-location">Tijuana</p>
          <button class="btn-add" onclick="agregarCarrito('Tapete', 300)">Añadir</button>
        </div>
      </div>
    </div>
  </div>
</main>
