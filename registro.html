<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter | Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f8fafc; }
        .register-card { max-width: 450px; margin: 60px auto; border-radius: 20px; border: none; }
        .btn-register { background: #000000; color: white; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .btn-register:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <div class="max-width-450 mx-auto mt-4">
        <a href="index.html" class="text-decoration-none text-muted small fw-bold">
            <i class="bi bi-arrow-left"></i> VOLVER A LA TIENDA
        </a>
    </div>

    <div class="card register-card shadow-lg p-4 mt-3">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Únete a Gunter<span>.</span></h2>
            <p class="text-muted">Crea tu cuenta para comprar en Tijuana</p>
        </div>
        
        <form id="register-form">
            <button type="submit" class="btn btn-register w-100 py-2 mb-3">Crear Cuenta</button>
            
            <div class="text-center">
                <p class="small">¿Ya tienes cuenta? <a href="iniciologin.html" class="text-decoration-none fw-bold text-primary">Inicia sesión</a></p>
            </div>
        </form>
    </div>
</div>

<script src="java/registro.js"></script>
</body>
</html>
