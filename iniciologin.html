<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gunter | Iniciar Sesión</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light-gunter" data-pagina="login">

  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="w-100" style="max-width: 460px;">

      <div class="text-center mb-4">
        <a href="index.html" class="back-link fw-bold text-decoration-none">
          <i class="bi bi-arrow-left-circle-fill me-2"></i>
          VOLVER A LA TIENDA
        </a>
      </div>

      <div class="card login-card shadow-lg border-0 rounded-4 p-4">
        <div class="text-center mb-4">
          <a href="index.html" class="logo text-decoration-none">
            Gunter<span>.</span>
          </a>

          <p class="text-muted mt-2 mb-0">Ingresa a tu cuenta</p>
        </div>
        
        <form id="login-form" novalidate>

          <div id="login-alert" class="alert d-none rounded-3" role="alert"></div>

          <div class="mb-3">
            <label for="email" class="form-label-custom">CORREO ELECTRÓNICO</label>
            <input 
              type="email" 
              id="email" 
              class="form-control custom-input" 
              placeholder="nombre@correo.com" 
              autocomplete="email"
              required
            >
          </div>

          <div class="mb-2">
            <label for="password" class="form-label-custom">CONTRASEÑA</label>
            <div class="position-relative">
              <input 
                type="password" 
                id="password" 
                class="form-control custom-input pe-5" 
                placeholder="••••••••" 
                autocomplete="current-password"
                required
              >

              <button 
                type="button" 
                id="toggle-password" 
                class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 text-muted"
                aria-label="Mostrar contraseña"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check small">
              <input class="form-check-input" type="checkbox" id="remember-user">
              <label class="form-check-label text-muted" for="remember-user">
                Recordarme
              </label>
            </div>

            <a href="#" class="small text-decoration-none">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
          
          <button type="submit" id="btn-login" class="btn btn-gunter-primary w-100 py-3 shadow-sm">
            Entrar
          </button>
          
          <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-2">¿Nuevo en la comunidad?</p>

            <a href="registro.html" class="btn btn-outline-gunter w-100 rounded-pill fw-bold py-2">
              Crear una cuenta nueva
            </a>
          </div>

        </form>
      </div>

      <p class="text-center text-muted small mt-3 mb-0">
        Este login está preparado para conectarse después con MariaDB.
      </p>

    </div>

  </main>

  <script src="java/login.js"></script>
</body>
</html>
